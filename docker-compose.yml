# Levanta la aplicación completa: SQL Server, la API y el frontend.
#
#   1. Copia .env.example a .env y cambia las contraseñas y la clave.
#   2. docker compose up --build
#   3. Abre http://localhost:8080
#
# Las contraseñas y la clave del token salen de .env, que no se sube al repositorio.

name: gestion-productos

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en el archivo .env}
    ports:
      # Solo accesible desde esta máquina, no desde la red.
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Crea la base con database/script.sql la primera vez y prepara el usuario de la API.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en el archivo .env}
    volumes:
      - ./database/script.sql:/scripts/script.sql:ro
      - ./docker/app-user.sql:/scripts/app-user.sql:ro
      - ./docker/db-init.sh:/scripts/db-init.sh:ro
    entrypoint: ["/bin/bash", "/scripts/db-init.sh"]
    restart: "no"

  api:
    build: ./backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=GestionProductos;User Id=gestion_app;Password=${APP_DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?Define JWT_KEY en el archivo .env}
      Cors__AllowedOrigins__0: http://localhost:8080
      # El contenedor habla HTTP; en un servidor real, el HTTPS lo pondría un proxy delante.
      Https__Redirect: "false"
    ports:
      - "5142:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5142/api
    environment:
      API_ORIGIN: http://localhost:5142
    depends_on:
      - api
    ports:
      - "8080:8080"

volumes:
  sqlserver-data:
